<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grayGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    HLS vs LL-HLS 비교
  </text>
  
  <!-- Traditional HLS Section -->
  <text x="50" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#6b7280">
    전통적인 HLS
  </text>
  
  <!-- Traditional HLS Timeline -->
  <g transform="translate(50, 100)">
    <!-- Encoding -->
    <rect x="0" y="0" width="80" height="40" fill="url(#grayGradient)" rx="5"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">인코딩</text>
    <text x="40" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6b7280">6s GOP</text>
    
    <!-- Arrow -->
    <path d="M 90 20 L 110 20" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Complete Segment -->
    <rect x="120" y="0" width="80" height="40" fill="url(#grayGradient)" rx="5"/>
    <text x="160" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">완전한</text>
    <text x="160" y="32" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">세그먼트</text>
    
    <!-- Arrow -->
    <path d="M 210 20 L 230 20" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- CDN -->
    <rect x="240" y="0" width="80" height="40" fill="url(#grayGradient)" rx="5"/>
    <text x="280" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">CDN에</text>
    <text x="280" y="32" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">발행</text>
    <text x="280" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6b7280">0.5s</text>
    
    <!-- Arrow -->
    <path d="M 330 20 L 350 20" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Player Buffer -->
    <rect x="360" y="0" width="80" height="40" fill="url(#grayGradient)" rx="5"/>
    <text x="400" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">플레이어</text>
    <text x="400" y="32" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">버퍼</text>
    <text x="400" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6b7280">18-30s</text>
    
    <!-- Total Latency -->
    <text x="500" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef4444">
      총 지연시간: 24-36초
    </text>
  </g>
  
  <!-- LL-HLS Section -->
  <text x="50" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">
    LL-HLS (Low-Latency)
  </text>
  
  <!-- LL-HLS Timeline -->
  <g transform="translate(50, 240)">
    <!-- Encoding -->
    <rect x="0" y="0" width="80" height="40" fill="url(#blueGradient)" rx="5"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">인코딩</text>
    <text x="40" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2563eb">1s GOP</text>
    
    <!-- Arrow -->
    <path d="M 90 20 L 110 20" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Partial Segments -->
    <rect x="120" y="0" width="80" height="40" fill="url(#blueGradient)" rx="5"/>
    <text x="160" y="18" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">200ms 부분</text>
    <text x="160" y="30" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">세그먼트</text>
    <text x="160" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2563eb">0.2s</text>
    
    <!-- Arrow -->
    <path d="M 210 20 L 230 20" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Immediate Publish -->
    <rect x="240" y="0" width="80" height="40" fill="url(#blueGradient)" rx="5"/>
    <text x="280" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">즉시</text>
    <text x="280" y="32" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">발행</text>
    <text x="280" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2563eb">0.1s</text>
    
    <!-- Arrow -->
    <path d="M 330 20 L 350 20" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Optimized Buffer -->
    <rect x="360" y="0" width="80" height="40" fill="url(#blueGradient)" rx="5"/>
    <text x="400" y="20" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">최적화된</text>
    <text x="400" y="32" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">버퍼</text>
    <text x="400" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#2563eb">1-2s</text>
    
    <!-- Total Latency -->
    <text x="500" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10b981">
      총 지연시간: 2-5초
    </text>
  </g>
  
  <!-- Performance Improvement -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="700" height="60" fill="#f0f9ff" stroke="#2563eb" stroke-width="2" rx="10"/>
    <text x="350" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2563eb">
      성능 개선: 80% 지연시간 감소
    </text>
    <text x="350" y="45" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#6b7280">
      부분 세그먼트 · 블로킹 리로드 · 프리로드 힌트를 통한 혁신적 개선
    </text>
  </g>
  
  <!-- Key Features -->
  <g transform="translate(50, 420)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">
      핵심 기술:
    </text>
    <text x="80" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">
      • 부분 세그먼트 (200-500ms)
    </text>
    <text x="250" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">
      • 블로킹 플레이리스트 리로드
    </text>
    <text x="420" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">
      • 프리로드 힌트
    </text>
    <text x="550" y="20" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">
      • HTTP/2 최적화
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280" />
    </marker>
  </defs>
</svg> 