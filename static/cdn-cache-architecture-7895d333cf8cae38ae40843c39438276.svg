<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="originGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="edgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="450" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    LL-HLS용 캐시 아키텍처
  </text>
  
  <!-- Origin Server -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="500" height="80" fill="url(#originGradient)" rx="10" filter="url(#shadow)"/>
    <text x="250" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      오리진 서버
    </text>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 블로킹 요청 처리
    </text>
    <text x="200" y="45" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 부분 세그먼트 생성
    </text>
    <text x="380" y="45" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 전달 지시자 처리
    </text>
    <text x="30" y="65" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 플레이리스트 업데이트 생성
    </text>
    <text x="200" y="65" font-family="Arial, sans-serif" font-size="12" fill="white">
      • HTTP/2 Push 지원
    </text>
    <text x="380" y="65" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 렌디션 리포트 제공
    </text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(295, 150)">
    <path d="M 0 0 L 0 30" stroke="#6b7280" stroke-width="3" marker-end="url(#arrowhead)"/>
    <circle cx="0" cy="15" r="4" fill="#6b7280"/>
  </g>
  
  <!-- Origin Shield -->
  <g transform="translate(50, 190)">
    <rect x="0" y="0" width="500" height="80" fill="url(#shieldGradient)" rx="10" filter="url(#shadow)"/>
    <text x="250" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      오리진 실드
    </text>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 요청 집약 (Request Collapsing)
    </text>
    <text x="250" y="45" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 델타 플레이리스트 생성
    </text>
    <text x="30" y="65" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 지속적 연결 풀링
    </text>
    <text x="250" y="65" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 캐시 효율성 최적화
    </text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(295, 280)">
    <path d="M 0 0 L 0 30" stroke="#6b7280" stroke-width="3" marker-end="url(#arrowhead)"/>
    <circle cx="0" cy="15" r="4" fill="#6b7280"/>
  </g>
  
  <!-- Edge Servers -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="500" height="80" fill="url(#edgeGradient)" rx="10" filter="url(#shadow)"/>
    <text x="250" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      엣지 서버
    </text>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 부분 세그먼트 캐싱
    </text>
    <text x="200" y="45" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 쿼리 매개변수 처리
    </text>
    <text x="350" y="45" font-family="Arial, sans-serif" font-size="12" fill="white">
      • AGE 헤더 삽입
    </text>
    <text x="30" y="65" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 블로킹 요청 지원
    </text>
    <text x="200" y="65" font-family="Arial, sans-serif" font-size="12" fill="white">
      • HTTP/2 멀티플렉싱
    </text>
    <text x="350" y="65" font-family="Arial, sans-serif" font-size="12" fill="white">
      • 우선순위 제어
    </text>
  </g>
  
  <!-- Flow indicators -->
  <g transform="translate(570, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">
      요청 흐름
    </text>
    <path d="M -10 10 L 10 10" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <g transform="translate(570, 230)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">
      캐시 계층
    </text>
    <path d="M -10 10 L 10 10" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <g transform="translate(570, 360)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280">
      클라이언트 배포
    </text>
    <path d="M -10 10 L 10 10" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Performance indicator -->
  <g transform="translate(50, 420)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10b981">
      ⚡ 최적화 포인트: 
    </text>
    <text x="120" y="0" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">
      각 계층에서 지연시간 최소화 및 캐시 효율성 극대화
    </text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
     refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280" />
    </marker>
  </defs>
</svg> 